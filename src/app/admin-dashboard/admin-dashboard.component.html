<div class="top-layout">
    <img src="./images/Prem.png" alt="No image">
    <p class="fullname">
        <span class="material-icons person-icon">person</span>
    
        {{ fullName }}
        </p>
      
    
    
</div>

<div class="content-layout">
    <aside class="side-layout">
        <h3 class="heading">Menu</h3>
        <mat-divider style="border: 1px solid white; margin-right: 30px;"></mat-divider>
        <ul class="nav-list">
            <li>
                <a 
                    (click)="showContent('home')" 
                    [ngClass]="{'active-link': selectedContent === 'home'}">
                    <span class="material-icons">home</span> Home
                </a>
            </li>
            <li>
                <a 
                    (click)="showContent('add-room')" 
                    [ngClass]="{'active-link': selectedContent === 'add-room'}">
                    <span class="material-icons">add</span> Add Room
                </a>
            </li>
            <li>
                <a 
                    (click)="showContent('remove-room')" 
                    [ngClass]="{'active-link': selectedContent === 'remove-room'}">
                    <span class="material-icons">cancel</span> Remove Room
                </a>
            </li>
            <li>
                <a 
                    (click)="showContent('book-room')" 
                    [ngClass]="{'active-link': selectedContent === 'book-room'}">
                    <span class="material-icons">add_circle</span> Book Room
                </a>
            </li>
            <li>
                <a 
                    (click)="showContent('history')" 
                    [ngClass]="{'active-link': selectedContent === 'history'}">
                    <span class="material-icons">history</span> History
                </a>
            </li>
        </ul>

        <h3 class="heading">Others</h3>
        <mat-divider style="border: 1px solid white; margin-right: 30px;"></mat-divider>
        <ul class="nav-list">
            <li>
                <a 
                    (click)="showContent('account')" 
                    [ngClass]="{'active-link': selectedContent === 'account'}">
                    <span class="material-icons">manage_accounts</span> Account
                </a>
            </li>
            <li>
                <a 
                    (click)="showContent('help')" 
                    [ngClass]="{'active-link': selectedContent === 'help'}">
                    <span class="material-icons">help</span> Help
                </a>
            </li>
            <li>
                <a 
                    (click)="showContent('feedback')" 
                    [ngClass]="{'active-link': selectedContent === 'feedback'}">
                    <span class="material-icons">notification_important</span> Complaints
                </a>
            </li>
        </ul>
        
        <p class="Logout-button">
            <button (click)="goToLogin()">Logout</button>
        </p>
    </aside>

    <div class="main-content">
        <!-- Conditionally display components based on selected menu item -->
        <app-facilities *ngIf="selectedContent === 'home'"></app-facilities>
        <app-addroom *ngIf="selectedContent == 'add-room'"></app-addroom>
        <app-complaint *ngIf="selectedContent == 'feedback'"></app-complaint>
        <app-removeroom *ngIf="selectedContent === 'remove-room'"></app-removeroom>
        <app-chatbot *ngIf="selectedContent === 'help'"></app-chatbot>
        <app-admindropdown *ngIf="selectedContent === 'book-room'"></app-admindropdown>
        <app-adminprofile *ngIf="selectedContent === 'account'"></app-adminprofile>
        <app-pasthistory *ngIf="selectedContent === 'history'"></app-pasthistory>
        <app-admincurrenthistory *ngIf="selectedContent === 'home'"></app-admincurrenthistory>

        <p>&#64;powered by RNTBCI</p>
      
    </div>
</div>
