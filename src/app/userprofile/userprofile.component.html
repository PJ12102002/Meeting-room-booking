<div *ngIf="employee; else loading">
  <div *ngIf="!isEditing">
    <h2>User Profile</h2>
    <p><strong>Full Name:</strong> {{ employee.fullName }}</p>
    <p><strong>Email:</strong> {{ employee.email }}</p>
    <p><strong>Designation:</strong> {{ employee.designation }}</p>
    <p><strong>Part:</strong> {{ employee.part }}</p>
    <p><strong>Role:</strong> {{ employee.role }}</p>
    <p><strong>Path:</strong> {{ employee.path }}</p>

    <button (click)="toggleEdit()">Edit</button>
  </div>

  <div *ngIf="isEditing">
    <h2>Edit Profile</h2>
    <form (ngSubmit)="saveProfile()">
      <label for="fullName">Full Name:</label>
      <input type="text" id="fullName" [(ngModel)]="employee.fullName" name="fullName" required>

      <label for="email">Email:</label>
      <input type="email" id="email" [(ngModel)]="employee.email" name="email" required>

      <label for="designation">Designation:</label>
      <input type="text" id="designation" [(ngModel)]="employee.designation" name="designation">

      <label for="part">Part:</label>
      <input type="text" id="part" [(ngModel)]="employee.part" name="part">

      <label for="role">Role:</label>
      <input type="text" id="role" [(ngModel)]="employee.role" name="role">

      <label for="path">Path:</label>
      <input type="text" id="path" [(ngModel)]="employee.path" name="path">

      <button type="submit">Save</button>
      <button type="button" (click)="toggleEdit()">Cancel</button>
    </form>
  </div>

  <div *ngIf="errorMessage" class="error">{{ errorMessage }}</div>

  <button (click)="goBack()">Go Back</button>
</div>

<ng-template #loading>
  <p>Loading...</p>
</ng-template>

<!-- Button to load the profile manually -->
<button (click)="loadProfile()">Load Profile</button>
