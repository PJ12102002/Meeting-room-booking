<div class="profile-container">
    <h2>Admin Profile</h2>
  
    <!-- Display admin data when not editing -->
    <div *ngIf="!isEditing">
      <p><strong>Full Name:</strong> {{ adminData.fullName }}</p>
      <p><strong>Email:</strong> {{ adminData.email }}</p>
      <p><strong>ZID:</strong> {{ adminData.zid }}</p>
      <button (click)="toggleEdit()">Edit</button>
    </div>
  
    <!-- Display editable form when editing -->
    <div *ngIf="isEditing">
      <form (ngSubmit)="updateProfile()">
        <div class="form-group">
          <label for="fullName">Full Name</label>
          <input
            type="text"
            id="fullName"
            [(ngModel)]="adminData.fullName"
            name="fullName"
            required
            class="form-control"
          />
        </div>
  
        <!-- <div class="form-group">
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            [(ngModel)]="adminData.email"
            name="email"
            required
            class="form-control"
          />
        </div> -->
  
        <button type="submit" class="btn btn-primary">Update</button>
        <button type="button" (click)="toggleEdit()" class="btn btn-secondary">Cancel</button>
      </form>
    </div>
  </div>
